name: Peak1 CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/peak1_test
          JWT_SECRET: test_jwt_secret_key_12345
        run: |
          cd server
          npm test

  frontend-build:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Vite Frontend
        run: |
          cd client
          npm run build
